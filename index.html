<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/e6030aed55.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="m-0 p-0 box-border">
    <!-- header start -->
<header class="py-4 shadow-sm bg-white">
    <div class="container flex items-center justify-between m-auto">
         <!------- logo ---------->
              <a href="#index.html" >
                      <img src="images/logo.svg" alt="" class="w-32">
                </a>
        
            <!------- search------------ -->
            <div class="w-full max-w-xs relative">
                <span class="absolute left-3 top-2.5 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass w-5 h-5"></i>
                </span >
                <input type="search" name="search" id="search" class="w-full border-2 border-[#FD3D57] border-r-0 pl-8 py-1.5  focus:outline-none rounded-l-md"  placeholder="Search for anything...">
                <button class="bg-[#FD3D57] border-[#FD3D57] text-white px-4 py-2 rounded-r-md hover:text-red-600 transition absolute left-[99.99%]" >Search</button>
            </div>
         <!------- icon --------------->
            <div class="flex items-center space-x-8 text-gray-700 text-lg ml-6" >
                 <a href="" class="relative text-center text-gray-500 hover:text-[#FD3D57] transition">
                    <div class="text-2xl">
                        <i class="fa-regular fa-heart"></i>
                    </div>
                    <div class="text-xs leading-3">Wish list</div>
                    <span class="absolute w-5 h-5 right-1 -top-1 rounded-full flex items-center
                     justify-center bg-[#FD3D57] text-white text-xs">8</span>
                    
                </a>
                <a href="" class=" text-center text-gray-500 hover:text-[#FD3D57] transition">
                    <div class="text-2xl">
                        <i class="fa-solid fa-cart-shopping"></i>
                    </div>
                    <div class="text-xs leading-3">Cart</div>
                </a>
                <a href="" class="text-center text-gray-500 hover:text-[#FD3D57] transition">
                    <div class="text-2xl">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <div class="text-xs leading-3">Account</div>
                </a>
            </div>
    </div>
</header>
<!------------ header end ------------------------------->

<nav class="bg-gray-800">
    <div class="container flex m-auto">
        <!-- All categories -->
         <div class="px-8 py-4 bg-[#FD3D57] items-center cursor-pointer relative group">
            <span class="text-white">
                <i class="fa-solid fa-bars"></i>
            </span>
            <span class="text-white capitalize ml-2">All Categories</span>

            <!-- Drop down -->
          <div class="absolute w-full left-0 top-full bg-white shadow-md py-3 divide-y divide-gray-300 divide-dashed hidden opacity-0 group-hover:opacity-100 group-hover:block transition duration-300">
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-100 transition">
                <img src="images/icons/bed.svg" alt="bed" class="w-5 h-5 object-contain">
                <span class="ml-6 text-gray-600 text-sm">Bedroom</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-100 transition">
                <img src="images/icons/sofa.svg" alt="sofa" class="w-5 h-5 object-contain">
                <span class="ml-6 text-gray-600 text-sm">Sofa</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-100 transition">
                <img src="images/icons/office.svg" alt="office" class="w-5 h-5 object-contain">
                <span class="ml-6 text-gray-600 text-sm">Office</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-100 transition">
                <img src="images/icons/terrace.svg" alt="terrace" class="w-5 h-5 object-contain">
                <span class="ml-6 text-gray-600 text-sm">Outdoor</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-100 transition">
                <img src="images/icons/bed-2.svg" alt="bed" class="w-5 h-5 object-contain">
                <span class="ml-6 text-gray-600 text-sm">Mattress</span>
            </a>
            <a href="#" class="flex items-center px-6 py-3 hover:bg-gray-100 transition">
                <img src="images/icons/restaurant.svg" alt="restaurant" class="w-5 h-5 object-contain">
                <span class="ml-6 text-gray-600 text-sm">Dining</span>
            </a>
          </div>
            <!-- Drop down -->
         </div>
         
         <!-- nav-bar-link -->
          <div class="flex items-center justify-between grow pl-12">
                <div class="flex items-center space-x-6 capitalize">
                    <a href="#" class="text-gray-200 hover:text-white transition">Home</a>
                    <a href="#" class="text-gray-200 hover:text-white transition">shop</a>
                    <a href="#" class="text-gray-200 hover:text-white transition">about us</a>
                    <a href="#" class="text-gray-200 hover:text-white transition">contact</a>
                </div>
                    <a href="#" class="text-gray-200 hover:text-white transition capitalize">login/signup</a>
          </div>
    </div>
</nav>
















    
</body>
</html>
